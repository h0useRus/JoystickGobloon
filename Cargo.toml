[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# Local builds only: releases take their version from the commits (.github/scripts/next-version.sh).
version = "0.6.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gob-i18n = { path = "crates/gob-i18n" }
gob-core = { path = "crates/gob-core" }
gob-gremlin = { path = "crates/gob-gremlin" }
quick-xml = "0.37"
gob-input = { path = "crates/gob-input" }
windows = "0.61"
gob-vjoy = { path = "crates/gob-vjoy" }
gob-virtual = { path = "crates/gob-virtual" }
gob-uinput = { path = "crates/gob-uinput" }
gob-hidhide = { path = "crates/gob-hidhide" }
gob-hide = { path = "crates/gob-hide" }
gob-engine = { path = "crates/gob-engine" }
gob-lighting = { path = "crates/gob-lighting" }
gob-ui = { path = "crates/gob-ui" }
eframe = "0.31"
egui = "0.31"
fluent-bundle = "0.15"
unic-langid = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rfd = "0.15"
egui-phosphor = "0.9"
log = "0.4"
libc = "0.2"
# Tests only: virtual Xbox 360 controllers through the ViGEmBus driver.
vigem-client = "0.1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
