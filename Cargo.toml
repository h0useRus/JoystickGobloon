[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gob-i18n = { path = "crates/gob-i18n" }
gob-core = { path = "crates/gob-core" }
gob-gremlin = { path = "crates/gob-gremlin" }
quick-xml = "0.37"
gob-input = { path = "crates/gob-input" }
windows = "0.61"
libloading = "0.8"
gob-vjoy = { path = "crates/gob-vjoy" }
gob-hidhide = { path = "crates/gob-hidhide" }
gob-engine = { path = "crates/gob-engine" }
gob-plugin = { path = "crates/gob-plugin" }
gob-lighting = { path = "crates/gob-lighting" }
eframe = "0.31"
fluent-bundle = "0.15"
unic-langid = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rfd = "0.15"
egui-phosphor = "0.9"
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
