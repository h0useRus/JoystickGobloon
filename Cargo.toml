[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# Local builds only: releases take their version from the commits (.github/scripts/next-version.sh).
version = "0.6.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gob-i18n = { git = "https://github.com/h0useRus/gobloon-common-ui", tag = "v0.1.0" }
gob-core = { path = "crates/gob-core" }
gob-gremlin = { path = "crates/gob-gremlin" }
quick-xml = "0.42"
gob-input = { path = "crates/gob-input" }
windows = "0.62"
gob-vjoy = { path = "crates/gob-vjoy" }
gob-virtual = { path = "crates/gob-virtual" }
gob-uinput = { path = "crates/gob-uinput" }
gob-hidhide = { path = "crates/gob-hidhide" }
gob-hide = { path = "crates/gob-hide" }
gob-engine = { path = "crates/gob-engine" }
gob-lighting = { path = "crates/gob-lighting" }
gob-ui = { git = "https://github.com/h0useRus/gobloon-common-ui", tag = "v0.1.0" }
gob-system = { path = "crates/gob-system" }
gob-voice = { path = "crates/gob-voice" }
# The OpenGL renderer: wgpu reserves hundreds of MB, the window stays small with glow.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
rfd = "0.17"
log = "0.4"
libc = "0.2"
# Voice: microphones on every OS, libvosk loaded at run time (the program runs without it).
cpal = "0.18"
libloading = "0.9"
serde_json = "1"
# Speech model downloads (gob-voice models.rs) and app updates: Windows TLS (Schannel) with the
# system roots. "native-tls", not "native-tls-no-default": ureq 3.4 only accepts the NativeTls
# provider with that feature name.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
sha2 = "0.11.1"
# Unpacking speech models; deflate through zlib-rs (pure Rust).
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Tests only: virtual Xbox 360 controllers through the ViGEmBus driver.
vigem-client = "0.1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
