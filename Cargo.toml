[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gob-i18n = { path = "crates/gob-i18n" }
gob-core = { path = "crates/gob-core" }
gob-gremlin = { path = "crates/gob-gremlin" }
quick-xml = "0.37"
gob-input = { path = "crates/gob-input" }
windows = "0.61"
eframe = "0.31"
fluent-bundle = "0.15"
unic-langid = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rfd = "0.15"
egui-phosphor = "0.9"

[profile.release]
lto = true
codegen-units = 1
