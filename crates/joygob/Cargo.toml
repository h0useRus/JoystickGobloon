[package]
name = "joygob"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "JoystickGobloon"
path = "src/main.rs"

[dependencies]
gob-i18n.workspace = true
gob-core.workspace = true
gob-gremlin.workspace = true
gob-input.workspace = true
gob-vjoy.workspace = true
gob-hidhide.workspace = true
gob-engine.workspace = true
gob-plugin.workspace = true
rfd.workspace = true
egui-phosphor.workspace = true
eframe.workspace = true
serde.workspace = true
toml.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
winresource = "0.1"
