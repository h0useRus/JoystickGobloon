[package]
name = "gob-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gob-core.workspace = true
gob-input.workspace = true
gob-virtual.workspace = true
gob-lighting.workspace = true
log.workspace = true
rodio = { version = "0.19", default-features = false, features = ["symphonia-wav", "symphonia-mp3", "symphonia-vorbis", "symphonia-flac"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Speech",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gob-system.workspace = true
gob-uinput.workspace = true
libc.workspace = true

[dev-dependencies]
gob-gremlin.workspace = true
