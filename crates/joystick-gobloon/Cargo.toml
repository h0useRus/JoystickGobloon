[package]
name = "joystick-gobloon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "JoystickGobloon"
path = "src/main.rs"

[dependencies]
gob-i18n.workspace = true
gob-core.workspace = true
gob-gremlin.workspace = true
gob-input.workspace = true
gob-virtual.workspace = true
gob-hide.workspace = true
gob-engine.workspace = true
gob-plugin.workspace = true
gob-lighting.workspace = true
rfd.workspace = true
egui-phosphor.workspace = true
eframe.workspace = true
serde.workspace = true
toml.workspace = true
log.workspace = true
tray-icon = "0.26"
# Update check (update.rs): Windows TLS (Schannel) with the system roots. "native-tls", not
# "native-tls-no-default": ureq 3.4 only accepts the NativeTls provider with that feature name.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
sha2 = "0.11.1"
semver = "1.0.28"

[target.'cfg(target_os = "linux")'.dependencies]
gob-uinput.workspace = true
libc.workspace = true
# The tray icon's thread (platform/linux/window.rs); the version tray-icon uses.
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
# The main window's HWND (platform/windows/window.rs).
raw-window-handle = "0.6"
windows = { workspace = true, features = [
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"
