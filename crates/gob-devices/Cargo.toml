[package]
name = "gob-devices"
description = "Device plugins: pictures of game controllers and which input each of their controls sends"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gob-core.workspace = true
# live.rs: a connected device's readings as plugin inputs.
gob-input.workspace = true
serde.workspace = true
# draw.rs: controls on their picture, the same in every program that shows them.
egui.workspace = true
toml.workspace = true
# index.rs: downloaded plugin files checked against the list.
sha2.workspace = true
# Pictures to pixels: drawings themed, photos decoded (the resvg egui_extras' svg loader uses).
resvg = "0.45.1"
