[package]
name = "gob-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gob-core.workspace = true
libloading.workspace = true

[[example]]
# A plugin DLL with only the info entry point: `cargo build -p gob-plugin --example stub_plugin`.
name = "stub_plugin"
crate-type = ["cdylib"]

[[example]]
# Lists the plugin DLLs in a folder: `cargo run -p gob-plugin --example list_plugins -- <dir>`.
name = "list_plugins"
