# main: release v<version> (version from Cargo.toml).
# dev:  pre-release v<version>-alpha.<run number>.
# Both build the app and the installer, after the same checks as CI.
name: Release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Installs the Rust version pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: bash
        run: |
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "${{ github.ref_name }}" = "main" ]; then
            version="$base"; prerelease=false
          else
            version="$base-alpha.${{ github.run_number }}"; prerelease=true
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists: bump the version in Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build
        env:
          JOYGOB_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release -p joygob

      # The installer installs the signed HidHide and vJoy drivers when they are missing. Pinned
      # by hash: a changed file fails the release instead of shipping something unchecked.
      - name: HidHide installer
        shell: pwsh
        run: |
          $name = "HidHide_1.5.230_x64.exe"
          $hash = "F4BBBCB82E6258641B887C74BC81C4C5F66E4AA811808DFC304347687B7605F6"
          $dir = "target\installer\deps"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/$name" -OutFile "$dir\$name"
          $got = (Get-FileHash "$dir\$name" -Algorithm SHA256).Hash
          if ($got -ne $hash) { Write-Error "$name hash $got, expected $hash"; exit 1 }

      # Official vJoy 2.1.9.1 (signed by its author, Justin Shafer): the version gob-vjoy targets.
      - name: vJoy installer
        shell: pwsh
        run: |
          $name = "vJoySetup.exe"
          $hash = "F103CED4E7FF7CCB49C8415A542C56768ED4DA4FEA252B8F4FFDAC343074654A"
          $dir = "target\installer\deps"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://github.com/jshafer817/vJoy/releases/download/v2.1.9.1/$name" -OutFile "$dir\$name"
          $got = (Get-FileHash "$dir\$name" -Algorithm SHA256).Hash
          if ($got -ne $hash) { Write-Error "$name hash $got, expected $hash"; exit 1 }

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\joygob.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "target\portable\JoystickGobloon"
          New-Item -ItemType Directory -Force "$dir\lang" | Out-Null
          Copy-Item target\release\JoystickGobloon.exe $dir
          Copy-Item lang\*.ftl "$dir\lang"
          Copy-Item LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "target\JoystickGobloon-${{ steps.version.outputs.version }}-portable.zip" -Force

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Joystick Gobloon ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            target/installer/JoystickGobloon-${{ steps.version.outputs.version }}-setup.exe
            target/JoystickGobloon-${{ steps.version.outputs.version }}-portable.zip

      # Discord: final releases to DISCORD_WEBHOOK, alpha builds to DISCORD_WEBHOOK_ALPHA
      # (each only when that secret is set). A failed post never fails the release.
      - name: Announce on Discord
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_ALPHA: ${{ secrets.DISCORD_WEBHOOK_ALPHA }}
        run: |
          $pre = "${{ steps.version.outputs.prerelease }}" -eq "true"
          .github/scripts/discord-announce.ps1 -Version "${{ steps.version.outputs.version }}" -Repo "${{ github.repository }}" -Sha "${{ github.sha }}" -Prerelease:$pre
