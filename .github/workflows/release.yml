# main: release v<version>, dev: pre-release v<version>-alpha.<run number>. The version comes
# from the Conventional Commits since the last release (.github/scripts/next-version.sh).
# Both build the app, the Windows installer and portable zip and the Linux AppImage, after the
# same checks as CI. The Linux and Windows builds run side by side; `publish` waits for both.
name: Release

on:
  push:
    branches: [main, dev]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Like ci.yml: no debug info in the checks' builds (less to compile and cache).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  # Linux: the AppImage (tools/linux/appimage.sh). Ubuntu 22.04: its older glibc keeps the
  # AppImage running on newer systems too (Steam Deck included).
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Cached .deb packages instead of apt-get update + download on every run.
      - name: System libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pkg-config libasound2-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libudev-dev libssl-dev libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 libxcb-xkb1
          version: 1
      # Packages restored from the cache skip the install scripts: refresh the library list, which
      # appimage.sh reads (ldconfig -p) to find the libraries it bundles.
      - name: Library cache
        run: sudo ldconfig
      # Installs the Rust version pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2

      # Same version as the Windows job: same script, commit and run number.
      - name: Version
        id: version
        run: |
          base=$(bash .github/scripts/next-version.sh)
          if [ "${{ github.ref_name }}" = "main" ]; then
            version="$base"
          else
            version="$base-alpha.${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build
        env:
          JOYSTICK_GOBLOON_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release -p joystick-gobloon

      - name: AppImage
        run: sh tools/linux/appimage.sh "${{ steps.version.outputs.version }}" target/appimage target/release/JoystickGobloon

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: target/appimage/JoystickGobloon-${{ steps.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  # Windows: the app, the installer and the portable zip, at the same time as the AppImage.
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      # Code signing through SignPath (docs/CODE_SIGNING.md): final releases only, and only
      # when the secret is set; alpha builds and forks stay unsigned.
      SIGN: ${{ github.ref_name == 'main' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installs the Rust version pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: bash
        run: |
          base=$(bash .github/scripts/next-version.sh)
          if [ "${{ github.ref_name }}" = "main" ]; then
            version="$base"; prerelease=false
          else
            version="$base-alpha.${{ github.run_number }}"; prerelease=true
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build
        env:
          JOYSTICK_GOBLOON_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release -p joystick-gobloon

      - name: Upload the app for signing
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: target/release/JoystickGobloon.exe
          if-no-files-found: error

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'JoystickGobloon' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/signed-exe

      # The installer and the portable zip take the signed exe.
      - name: Use the signed app
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item target\signed-exe\JoystickGobloon.exe target\release\JoystickGobloon.exe -Force

      # The installer installs the signed HidHide and vJoy drivers when they are missing. Pinned
      # by hash: a changed file fails the release instead of shipping something unchecked.
      - name: HidHide installer
        shell: pwsh
        run: |
          $name = "HidHide_1.5.230_x64.exe"
          $hash = "F4BBBCB82E6258641B887C74BC81C4C5F66E4AA811808DFC304347687B7605F6"
          $dir = "target\installer\deps"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://github.com/nefarius/HidHide/releases/download/v1.5.230.0/$name" -OutFile "$dir\$name"
          $got = (Get-FileHash "$dir\$name" -Algorithm SHA256).Hash
          if ($got -ne $hash) { Write-Error "$name hash $got, expected $hash"; exit 1 }

      # Official vJoy 2.1.9.1 (signed by its author, Justin Shafer): the version gob-vjoy targets.
      - name: vJoy installer
        shell: pwsh
        run: |
          $name = "vJoySetup.exe"
          $hash = "F103CED4E7FF7CCB49C8415A542C56768ED4DA4FEA252B8F4FFDAC343074654A"
          $dir = "target\installer\deps"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://github.com/jshafer817/vJoy/releases/download/v2.1.9.1/$name" -OutFile "$dir\$name"
          $got = (Get-FileHash "$dir\$name" -Algorithm SHA256).Hash
          if ($got -ne $hash) { Write-Error "$name hash $got, expected $hash"; exit 1 }

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\JoystickGobloon.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: target/installer/JoystickGobloon-${{ steps.version.outputs.version }}-setup.exe
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'JoystickGobloon' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/signed-setup

      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item target\signed-setup\*.exe target\installer\ -Force

      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "target\portable\JoystickGobloon"
          New-Item -ItemType Directory -Force "$dir\lang" | Out-Null
          Copy-Item target\release\JoystickGobloon.exe $dir
          Copy-Item lang\*.ftl "$dir\lang"
          Copy-Item LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "target\JoystickGobloon-${{ steps.version.outputs.version }}-portable.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target/installer/JoystickGobloon-${{ steps.version.outputs.version }}-setup.exe
            target/JoystickGobloon-${{ steps.version.outputs.version }}-portable.zip
          if-no-files-found: error

  # The release with every file, once both builds are done.
  publish:
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Only these two: on main the unsigned installer kept for signing has the same name.
      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: target/release-files
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: target/release-files

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Joystick Gobloon ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.windows.outputs.prerelease }}
          generate_release_notes: true
          files: |
            target/release-files/JoystickGobloon-${{ env.VERSION }}-setup.exe
            target/release-files/JoystickGobloon-${{ env.VERSION }}-portable.zip
            target/release-files/JoystickGobloon-${{ env.VERSION }}-x86_64.AppImage

      # Discord: final releases to DISCORD_WEBHOOK, alpha builds to DISCORD_WEBHOOK_ALPHA
      # (each only when that secret is set). A failed post never fails the release.
      - name: Announce on Discord
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_ALPHA: ${{ secrets.DISCORD_WEBHOOK_ALPHA }}
        run: |
          $pre = "${{ needs.windows.outputs.prerelease }}" -eq "true"
          .github/scripts/discord-announce.ps1 -Version "${{ env.VERSION }}" -Repo "${{ github.repository }}" -Sha "${{ github.sha }}" -Prerelease:$pre
