# The website (site/) is published to h0userus.github.io/gobloon when a release reaches main, so it
# describes the released version: the files are pushed to
# the h0useRus/gobloon repository, which serves them with GitHub Pages. Needs the
# GOBLOON_PAGES_TOKEN secret (a fine-grained token with contents: write on that repository).
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/website.yml"]
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push to h0useRus/gobloon
        env:
          TOKEN: ${{ secrets.GOBLOON_PAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::GOBLOON_PAGES_TOKEN is not set, nothing published."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/h0useRus/gobloon.git" out
          bash .github/scripts/publish-site.sh out "${GITHUB_SHA::7}"
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: publish website from ${GITHUB_SHA::7}"
          git push
