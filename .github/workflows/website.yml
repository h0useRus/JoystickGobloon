# The website (site/) is published to h0userus.github.io/joystick-gobloon when a release reaches
# main, so it describes the released version: the files are pushed to the h0useRus/joystick-gobloon
# repository, which serves them with GitHub Pages. The push uses a deploy key of that repository
# (write access to it alone): its private half is the JOYSTICK_GOBLOON_DEPLOY_KEY secret here.
# The old address h0userus.github.io/gobloon (repository h0useRus/gobloon, key GOBLOON_DEPLOY_KEY)
# gets pages that send visitors on to the new one. Without a secret the run fails, so a release
# never leaves an old site online unnoticed.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/website.yml"
      - ".github/scripts/publish-site.sh"
      - ".github/scripts/redirect-site.sh"
      - ".github/scripts/push-pages.sh"
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # publish-site.sh dates the sitemap entries by the pages' last commits.
          fetch-depth: 0
      - name: Push to h0useRus/joystick-gobloon
        env:
          DEPLOY_KEY: ${{ secrets.JOYSTICK_GOBLOON_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::The JOYSTICK_GOBLOON_DEPLOY_KEY secret is not set: the website was not published."
            exit 1
          fi
          bash .github/scripts/push-pages.sh joystick-gobloon \
            "bash .github/scripts/publish-site.sh out ${GITHUB_SHA::7}" \
            "chore: publish website from ${GITHUB_SHA::7}"
      - name: Redirect h0useRus/gobloon
        env:
          DEPLOY_KEY: ${{ secrets.GOBLOON_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::The GOBLOON_DEPLOY_KEY secret is not set: the old address does not redirect."
            exit 1
          fi
          bash .github/scripts/push-pages.sh gobloon \
            "bash .github/scripts/redirect-site.sh out https://h0userus.github.io/joystick-gobloon/" \
            "chore: redirect to h0userus.github.io/joystick-gobloon"
