# Checks every pull request and every push to a work branch (dev and main run release.yml).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Release versions come from the commit messages (.github/scripts/next-version.sh).
      - name: Conventional commits
        shell: bash
        run: bash .github/scripts/next-version.sh --check "origin/${{ github.base_ref || 'dev' }}..HEAD"
      # Installs the Rust version pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # Dependencies no crate uses any more (searches the sources, no build needed).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Unused dependencies
        run: cargo machete
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The Linux version: the same code must build and pass there too.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev libudev-dev libssl-dev libxkbcommon-dev libwayland-dev
      # Installs the Rust version pinned in rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
