<!doctype html><meta charset="utf-8"><title>Joystick Gobloon icons</title>
<style>
body{margin:0;font:14px system-ui;display:grid;grid-template-columns:1fr 1fr}
section{padding:16px}.l{background:#f3f4f6;color:#111}.d{background:#1e1e1e;color:#eee}
.row{display:flex;align-items:end;gap:14px;margin:10px 0 18px}h3{margin:0}
</style>
<script>
const v=[["a-grin.svg","A — Grin"],["b-pilot.svg","B — Pilot"],["c-flat.svg","C — Flat"],["../JoystickGobloon.svg","D — Sticker"]];
document.addEventListener("DOMContentLoaded",()=>{for(const c of["l","d"]){const s=document.createElement("section");s.className=c;
for(const[f,n]of v){s.innerHTML+=`<h3>${n}</h3><div class=row>${[160,64,32,16].map(z=>`<img src="${f}" width=${z} height=${z}>`).join("")}</div>`}
document.body.append(s)}});
</script>
